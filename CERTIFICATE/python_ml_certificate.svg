<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="hrGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGrad)" />

  <!-- Outer Frame -->
  <rect x="20" y="20" width="960" height="660" fill="#FFFFFF" stroke="#059669" stroke-width="2" rx="4" />
  
  <polygon points="20,20 60,20 20,60" fill="#059669" />
  <polygon points="980,20 940,20 980,60" fill="#059669" />
  <polygon points="20,680 60,680 20,640" fill="#059669" />
  <polygon points="980,680 940,680 980,640" fill="#059669" />

  <!-- Right Ribbon Bar -->
  <rect x="730" y="20" width="130" height="460" fill="#0F172A" />
  <rect x="740" y="20" width="4" height="460" fill="#059669" />
  <rect x="846" y="20" width="4" height="460" fill="#059669" />

  <!-- Ribbon Seal Medal -->
  <g transform="translate(795, 480)">
    <circle cx="0" cy="0" r="56" fill="#059669" />
    <circle cx="0" cy="0" r="48" fill="#0F172A" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#059669" stroke-width="2" />
    <path d="M -12,-12 L -12,12 M -12,0 L 0,12 L 12,0 M 12,-12 L 12,12" stroke="#059669" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Header Branding -->
  <g transform="translate(80, 75)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#059669">Hacker<tspan fill="#0F172A">Rank</tspan></text>
    <rect x="165" y="-18" width="1.5" height="24" fill="#CBD5E1" />
    <text x="180" y="-1" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748B" letter-spacing="1">DEVELOPER CERTIFICATION</text>
  </g>

  <!-- Certificate Subtitle & Main Title -->
  <text x="80" y="150" font-family="'Times New Roman', Georgia, serif" font-size="20" letter-spacing="2" fill="#475569">CERTIFICATE OF COMPLETION</text>
  <text x="80" y="195" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#0F172A">Python &amp; Automation Development</text>

  <!-- Recipient Name -->
  <text x="80" y="275" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#0F172A">Anshul Raturi</text>
  <line x1="80" y1="290" x2="650" y2="290" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Course Text -->
  <text x="80" y="335" font-family="Arial, sans-serif" font-size="14" fill="#64748B">has successfully cleared the HackerRank Technical Assessment:</text>
  <text x="80" y="375" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#059669">Python (Basic &amp; Advanced Automation)</text>

  <text x="80" y="440" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Demonstrated high proficiency in Python 3, Web Automation, Scraping, and AI Model Integration.</text>

  <!-- Watermark Stamp -->
  <g transform="translate(400, 480) rotate(-12)" opacity="0.12">
    <circle cx="0" cy="0" r="65" fill="none" stroke="#059669" stroke-width="4" />
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#059669" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- Presenter Details -->
  <g transform="translate(520, 540)">
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Vivek Ravisankar</text>
    <text x="0" y="48" font-family="Arial, sans-serif" font-size="12" fill="#64748B">CEO &amp; Co-Founder, HackerRank</text>
  </g>

  <!-- Date & Code -->
  <text x="80" y="570" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155">30<tspan font-size="10" dy="-4">th</tspan><tspan font-size="14" dy="4"> March 2026</tspan></text>
  <text x="80" y="598" font-family="Arial, sans-serif" font-size="14" fill="#334155">Certificate code : <tspan font-weight="bold">HR-PY-5107</tspan></text>

</svg>
